packages:
  - "apps/*"
  - "packages/*"

# Yeni yayınlanan sürümleri 1 gün (dakika cinsinden) bekledikten sonra kur
minimumReleaseAge: 1440

# Kurulum script'i çalıştırmasına izin verilen paketler.
# Yeni paket script isterse pnpm uyarır: `pnpm approve-builds` ile tek tek onayla.
onlyBuiltDependencies:
  - prisma
  - "@prisma/engines"
  - esbuild

# Kurulum script'i bilerek engellenen paketler (uyarı vermesin diye).
# unrs-resolver: eslint-plugin-import-x bağımlılığı; script sadece yedek binary indirir.
ignoredBuiltDependencies:
  - unrs-resolver
